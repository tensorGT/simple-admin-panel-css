<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Admin Dashboard - CSS Grid Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- pure css checkbox hack to collapse/expand the sidebar -->
  <input type="checkbox" id="sidebar-toggle" class="sidebar-checkbox">

  <div class="dashboard-shell">
    <!-- sticky top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <label for="sidebar-toggle" class="toggle-btn" title="Toggle sidebar" aria-label="Toggle navigation sidebar">
          ☰
        </label>
        <span class="brand">DevMetrics</span>
      </div>

      <div class="topbar-right">
        <span class="env-pill">Production</span>
        <span class="user-badge">Alex</span>
      </div>
    </header>

    <!-- collapsible side nav -->
    <aside class="sidebar" aria-label="Main navigation">
      <nav>
        <ul class="nav-list">
          <li><a href="#overview" class="nav-link active"><span class="icon">📊</span><span class="label">Overview</span></a></li>
          <li><a href="#orders" class="nav-link"><span class="icon">📦</span><span class="label">Orders</span></a></li>
          <li><a href="#customers" class="nav-link"><span class="icon">👥</span><span class="label">Customers</span></a></li>
          <li><a href="#reports" class="nav-link"><span class="icon">📈</span><span class="label">Reports</span></a></li>
          <li><a href="#settings" class="nav-link"><span class="icon">⚙️</span><span class="label">Settings</span></a></li>
        </ul>
      </nav>
      <div class="sidebar-note">
        <p>CSS-only sidebar toggle!</p>
      </div>
    </aside>

    <!-- main content -->
    <main class="main-content" id="overview">
      <div class="page-title-row">
        <h1>Store Overview</h1>
        <p>June 2020 snapshot</p>
      </div>

      <!-- summary metric cards -->
      <section class="metrics-grid" aria-label="Summary metrics">
        <article class="metric-card">
          <p class="metric-label">Monthly Revenue</p>
          <p class="metric-value">$14,820</p>
          <p class="metric-change up">+12.4% vs last month</p>
        </article>

        <article class="metric-card">
          <p class="metric-label">Active Users</p>
          <p class="metric-value">1,942</p>
          <p class="metric-change up">+5.8% vs last month</p>
        </article>

        <article class="metric-card">
          <p class="metric-label">Open Tickets</p>
          <p class="metric-value">23</p>
          <p class="metric-change down">-4 from yesterday</p>
        </article>

        <article class="metric-card">
